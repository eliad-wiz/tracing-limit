[package]
name = "tracing-limit"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false
license = "MPL-2.0"

[lints]
workspace = true

[dependencies]
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { workspace = true, features = ["registry", "std"] }
dashmap = { version = "6.1.0", default-features = false }
derive_builder = "0.20.2"

[dev-dependencies]
criterion.workspace = true
mock_instant.workspace = true
serial_test.workspace = true
tracing = "0.1.44"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[[bench]]
name = "limit"
harness = false

# Everything below stands in for Vector's workspace, which this crate inherits
# from upstream. Keeping the inherited keys (`workspace = true`) intact means
# the sections above stay byte-identical to upstream and never conflict on sync.
[workspace]

[workspace.dependencies]
criterion = "0.8"
mock_instant = { version = "0.6" }
serial_test = { version = "4.0" }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)', 'cfg(ddsketch_extended)'] }

[workspace.lints.clippy]
string_slice = "warn"
await_holding_lock = "warn"
let_underscore_must_use = "warn"
unused_async = "warn"
redundant_clone = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
borrow_as_ptr = "warn"
checked_conversions = "warn"
ptr_as_ptr = "warn"
ref_as_ptr = "warn"
rc_buffer = "warn"
todo = "warn"
